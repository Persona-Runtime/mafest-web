# 웹 이미지 빌드·검사·게시. 수동 실행 또는 release-* 태그에서만 돈다.
#
# build에서 linux/amd64 이미지를 러너에 load해 검사하고, 통과한 이미지 자체를 artifact로
# 넘긴다. publish는 그 artifact를 load해 다시 빌드하지 않는다. 빌드가 달라져 검사하지 않은
# 이미지가 게시되는 일을 막기 위한 순서다.
name: images

on:
  workflow_dispatch:
  push:
    tags: ["release-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          load: true
          tags: mafest-web:candidate
      - name: 게시 전 이미지 검사
        run: bash scripts/verify-container.sh --no-build mafest-web:candidate
      - name: 검사한 이미지 저장
        run: docker save mafest-web:candidate -o mafest-web.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-web
          path: mafest-web.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-web
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 검사한 이미지 push와 digest 기록
        shell: bash
        run: |
          set -euo pipefail
          target="ghcr.io/persona-runtime/mafest-web:sha-${GITHUB_SHA::12}"
          pushed=()

          report_success() {
            {
              echo "### 게시 결과"
              for ref in "${pushed[@]}"; do
                digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
                echo "- \`${ref}\` linux/amd64 digest: \`${digest}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          }

          on_exit() {
            status=$?
            trap - EXIT
            if (( status != 0 )); then
              {
                echo "### 게시 실패"
                if (( ${#pushed[@]} == 0 )); then
                  echo "- 성공이 확인된 대상 없음"
                else
                  for ref in "${pushed[@]}"; do
                    echo "- 게시 성공: \`${ref}\`"
                  done
                fi
                # registry push는 원자적이지 않아 실패 전에 일부 layer나 manifest가 올라갈 수 있다.
                echo "- **부분 게시 가능 — 원격 상태를 확인한 뒤 재실행이 필요하다.**"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          }
          trap on_exit EXIT

          docker load -i mafest-web.tar
          docker tag mafest-web:candidate "$target"
          docker push "$target"
          pushed+=("$target")
          report_success
