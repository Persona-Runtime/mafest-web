<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: 가상 키보드가 올라오면 뷰포트 자체를
      줄여, 하단에 붙인 입력줄이 키보드 뒤로 숨지 않는다(기본값은 뷰포트를
      그대로 두고 화면만 밀어 올린다).
      viewport-fit=cover: env(safe-area-inset-bottom)을 쓰려면 필요하다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      공개 URL이지만 검색엔진 색인은 막는다(37 §0). robots.txt(Disallow)는 수집을,
      이 태그와 nginx의 X-Robots-Tag는 다른 경로로 수집된 경우의 색인을 막는다.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>금융상품 질의 검색</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
